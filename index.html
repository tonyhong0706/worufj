<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VERSTAPPEN // DINO RUN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="badge">MV<br>33</div>
        <div>
          <h1>VERSTAPPEN // DINO RUN</h1>
          <p class="subtitle">RED BULL RACING · KEEP PUSHING</p>
        </div>
      </div>
      <div class="hud" aria-label="遊戲資訊">
        <div><strong id="score">00000</strong><span>SCORE</span></div>
        <div><strong id="best">00000</strong><span>BEST</span></div>
      </div>
    </header>

    <section class="game-wrap">
      <canvas id="game" width="960" height="420" aria-label="Max Verstappen 小恐龍跑酷遊戲"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">READY TO RACE?</h2>
          <p id="overlay-copy">按 <kbd>空白鍵</kbd> 或點擊畫面跳躍</p>
          <p>跳起來時，Max 會把紅牛 F1 扛在肩上！</p>
        </div>
      </div>
    </section>

    <footer>
      <span class="tip">SPACE / ↑ / 點擊：跳躍　·　撞到障礙物後重新開始</span>
      <button id="restart" type="button">↻ 重新出發</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
