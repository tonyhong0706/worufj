<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>秦始皇騎北極熊</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="badge" aria-hidden="true">秦</div>
        <div>
          <h1>秦始皇騎北極熊</h1>
          <p class="subtitle">極地遠征 · 極光之下</p>
        </div>
      </div>
      <div class="hud" aria-label="遊戲資訊">
        <div><strong id="score">00000</strong><span>SCORE</span></div>
        <div><strong id="best">00000</strong><span>BEST</span></div>
        <div><strong id="coin-count">00</strong><span>COINS</span></div>
      </div>
    </header>

    <section class="game-wrap">
      <canvas id="game" width="960" height="420" aria-label="秦始皇騎北極熊穿越冰原的跑酷遊戲"></canvas>
      <div id="sprite-layer" class="sprite-layer" aria-hidden="true">
        <img id="player-gif-fallback" src="assets/BAR.gif" alt="">
      </div>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">穿越極地！</h2>
          <p id="overlay-copy">按 <kbd>空白鍵</kbd> 或點擊畫面跳躍</p>
          <p>躲開冰塊與冰柱，奔向極光！</p>
        </div>
      </div>
    </section>

    <footer>
      <span class="tip">空白鍵 / ↑ / 點擊：跳躍　·　↓：快速下落　·　撞到障礙物後重新出發</span>
      <button id="restart" type="button">↻ 重新出發</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
